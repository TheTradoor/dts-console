name: Browser acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium in the isolated CI runner
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise public fixtures in desktop and mobile viewports
        env:
          DTS_BROWSER_BASE_URL: http://127.0.0.1:4173/
        run: |
          mkdir -p artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > artifacts/browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$DTS_BROWSER_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$DTS_BROWSER_BASE_URL" > /dev/null
          npm run test:browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
